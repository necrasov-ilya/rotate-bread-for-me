<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#87b9d8" />
    <meta
      name="description"
      content="Самая важная игра в интернете: переверни хлеб."
    />
    <title>Переверни хлеб</title>
    <link rel="icon" href="assets/bread.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game">
      <h1 id="message" aria-live="polite">ПЕРЕВЕРНИ ХЛЕБ</h1>

      <button class="bread-button" id="bread" type="button" aria-label="Перевернуть хлеб">

      </button>
    </main>

    <button class="language-button" id="language" type="button" aria-label="Switch to English">
      EN

    <a
      class="github-link"
      href="https://github.com/necrasov-ilya/rotate-bread-for-me"

</html>
